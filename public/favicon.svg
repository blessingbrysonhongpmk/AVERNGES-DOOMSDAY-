<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Outer metallic shield border -->
  <rect width="64" height="64" rx="12" fill="#070809" />
  <rect x="2" y="2" width="60" height="60" rx="10" stroke="#25292B" stroke-width="1.5" />
  
  <!-- Subtle green atmospheric glow -->
  <circle cx="32" cy="30" r="18" fill="#657D65" fill-opacity="0.2" filter="blur(4px)" />

  <!-- Doctor Doom Stylized Mask / Geometric Faceplate -->
  <!-- Hood silhouette -->
  <path d="M18 48C18 26 24 14 32 14C40 14 46 26 46 48" stroke="#657D65" stroke-width="2" stroke-linecap="round" />
  
  <!-- Metallic Faceplate Crown & Temples -->
  <path d="M22 26L32 20L42 26V35C42 42 37 47 32 49C27 47 22 42 22 35V26Z" fill="#101214" stroke="#A6ADB5" stroke-width="1.8" stroke-linejoin="round" />
  
  <!-- Angular Eye Slits -->
  <polygon points="26,30 30,32 26,33" fill="#657D65" />
  <polygon points="38,30 34,32 38,33" fill="#657D65" />
  
  <!-- Metallic Rivets -->
  <circle cx="25" cy="27" r="1" fill="#D8DDE3" />
  <circle cx="39" cy="27" r="1" fill="#D8DDE3" />
  
  <!-- Mouth Grille (Horizontal Slits) -->
  <line x1="29" y1="38" x2="35" y2="38" stroke="#A6ADB5" stroke-width="1.2" stroke-linecap="round" />
  <line x1="28" y1="41" x2="36" y2="41" stroke="#A6ADB5" stroke-width="1.2" stroke-linecap="round" />
  <line x1="30" y1="44" x2="34" y2="44" stroke="#A6ADB5" stroke-width="1.2" stroke-linecap="round" />
</svg>

